name: Sync Garmin Data

on:
  schedule:
    # 09:00 UTC ≈ 12:00 שעון ישראל (קיץ) / 11:00 (חורף) — סביב הצהריים
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "כמה ימים אחורה למשוך (למילוי היסטורי חד-פעמי)"
        required: false
        default: ""
      debug:
        description: "אבחון מבנה ה-API (מדפיס שמות מפתחות בלבד, ללא ערכים)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Restore Garmin token store
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data from Garmin Connect
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FETCH_DAYS: ${{ inputs.days }}
          DEBUG_GARMIN: ${{ inputs.debug }}
        run: python scripts/fetch_garmin.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily Garmin data sync"
            git push
          fi
