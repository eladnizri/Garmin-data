name: Sync Garmin Data

on:
  schedule:
    # 10:00 UTC = 13:00 שעון ישראל בקיץ, 12:00 בחורף.
    # ה-cron של GitHub הוא ב-UTC ואינו מכיר שעון קיץ, ולכן שעה אחת אינה
    # יכולה לכסות את שתי התקופות. בפועל הריצה גם נדחית ב-10–60 דקות.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "כמה ימים אחורה למשוך (למילוי היסטורי חד-פעמי)"
        required: false
        default: ""
      debug:
        description: "אבחון מבנה ה-API (מדפיס שמות מפתחות בלבד, ללא ערכים)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Restore Garmin token store
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch data from Garmin Connect
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FETCH_DAYS: ${{ inputs.days }}
          DEBUG_GARMIN: ${{ inputs.debug }}
        # הסקריפט כותב את הקובץ רק בסוף, ולכן כישלון באמצע משאיר את הנתונים
        # הקודמים שלמים והניסיון החוזר בטוח. רוב הכשלים כאן הם הגבלת קצב
        # מגרמין או נפילה זמנית — שניהם חולפים תוך דקות.
        run: |
          for attempt in 1 2 3; do
            if python scripts/fetch_garmin.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 150))
              echo "::warning::ניסיון $attempt נכשל — ממתין ${wait}ש׳ לפני ניסיון נוסף"
              sleep "$wait"
            fi
          done
          echo "::error::שלושת הניסיונות למשוך נתונים מגרמין נכשלו"
          exit 1

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily Garmin data sync"
            git push
          fi
